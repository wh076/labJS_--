<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание №2 - XHR Запросы</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Задание №2 - Работа с XMLHttpRequest</h1>

            <button id="callback-xhr-btn">Выполнить запросы</button>

            <button id="promise-xhr-btn">Выполнить запросы</button>

            <button id="async-xhr-btn">Выполнить запросы</button>

        <div id="results">
            <h3>Результаты запросов:</h3>
            <pre id="output"></pre>
        </div>
